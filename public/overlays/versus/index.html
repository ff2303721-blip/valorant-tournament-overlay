<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Versus – Intermission</title>
  <style>
    /* ── OBS CRITICAL ─────────────────────────────── */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: rgba(0,0,0,0) !important;
      background-color: rgba(0,0,0,0) !important;
    }
  </style>
  <link rel="stylesheet" href="versus.css">
</head>
<body>

<div class="vs-root">

  <!-- ── BACKGROUND LAYERS ─────────────────────── -->
  <div class="bg-art"></div>
  <div class="bg-vignette"></div>
  <div class="bg-aura aura-left"></div>
  <div class="bg-aura aura-right"></div>
  <div class="bg-light-beams"></div>

  <!-- ── TOP HEADER ────────────────────────────── -->
  <header class="top-header">
    <div class="val-emblem-wrap">
      <!-- Valorant V Logo -->
      <svg class="val-logo-svg" viewBox="0 0 100 100" fill="currentColor">
        <path d="M99.2 16.5l-44.8 67h-21l44.8-67h21zm-65.8 0l-33.4 34.2h21l22.4-23 10-11.2h-20z"/>
      </svg>
      <span class="val-text">VALORANT</span>
    </div>
    <div class="tournament-title-gold-wrap">
      <span class="gold-chevron-left"></span>
      <h1 class="tournament-title-gold" id="vs-title">XMD VALORANT TOURNAMENT</h1>
      <span class="gold-chevron-right"></span>
    </div>
  </header>

  <!-- ── MAIN MATCHUP ───────────────────────────── -->
  <main class="matchup">

    <!-- LEFT TEAM PANEL (DEFENDERS) -->
    <div class="team-panel panel-left" id="panel-a">
      <div class="side-pill side-defenders" id="vs-side-a">
        <span class="side-accent-bar"></span>
        <span class="side-text" id="vs-side-text-a">DEFENDERS</span>
      </div>

      <div class="logo-container">
        <div class="logo-backglow"></div>
        <img id="vs-logo-a" class="vs-team-crest" src="/logos/veyron.png" alt="Logo">
      </div>

      <div class="team-acronym" id="vs-tag-a">VRN</div>
      <div class="team-fullname" id="vs-name-a">VEYRON</div>
    </div>

    <!-- CENTER PIECE -->
    <div class="center-piece">
      <!-- Golden bracket box with V/S -->
      <div class="vs-box">
        <div class="bracket-tl"></div>
        <div class="bracket-tr"></div>
        <div class="bracket-bl"></div>
        <div class="bracket-br"></div>
        <div class="vs-text-brush">V/S</div>
      </div>

      <!-- Map display box -->
      <div class="map-section">
        <div class="map-label-top">NEXT MAP</div>
        <div class="map-name-pill" id="vs-map">BIND</div>
      </div>

      <!-- Series pips hidden / fallback -->
      <div class="series-pips-wrap" style="display:none;">
        <div class="pips-row" id="pips-a"></div>
        <div class="pips-row" id="pips-b"></div>
      </div>
    </div>

    <!-- RIGHT TEAM PANEL (ATTACKERS) -->
    <div class="team-panel panel-right" id="panel-b">
      <div class="side-pill side-attackers" id="vs-side-b">
        <span class="side-text" id="vs-side-text-b">ATTACKERS</span>
        <span class="side-accent-bar"></span>
      </div>

      <div class="logo-container">
        <div class="logo-backglow"></div>
        <img id="vs-logo-b" class="vs-team-crest" src="/logos/naadan-legacy.png" alt="Logo">
      </div>

      <div class="team-acronym" id="vs-tag-b">NDL</div>
      <div class="team-fullname" id="vs-name-b">NAADAN LEGACY</div>
    </div>

  </main>

  <!-- ── BOTTOM STATUS BAR ──────────────────────── -->
  <footer class="bottom-bar">
    <div class="bottom-ornament-left">
      <span class="dot"></span>
      <span class="line"></span>
    </div>
    <span class="status-msg" id="vs-status">MATCH WILL BEGIN SHORTLY</span>
    <div class="bottom-ornament-right">
      <span class="line"></span>
      <span class="dot"></span>
    </div>
  </footer>

</div><!-- /vs-root -->

  <script src="/common/autoscale.js"></script>
  <script src="versus.js"></script>
</body>
</html>
